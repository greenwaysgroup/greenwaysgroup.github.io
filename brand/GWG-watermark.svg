  <title id="gwg-watermark-title">Green Ways Group watermark</title>
  <desc id="gwg-watermark-desc">The green road mark with two aligned rows of compact, optically spaced capitals: GREENWAYS and GROUP.CO.UK. Lettering is cut out transparently.</desc>
